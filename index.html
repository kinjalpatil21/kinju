<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Boyfriend's Day ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Trebuchet MS',sans-serif;
}

body{
margin:0;
overflow:hidden;
font-family:'Trebuchet MS',sans-serif;

background:
linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)),
url("https://www.transparenttextures.com/patterns/cream-paper.png"),
repeating-linear-gradient(
45deg,
#7d0918 0px,
#7d0918 40px,
#9d2235 40px,
#9d2235 80px
);

background-size:cover;

}

.card{

width:92%;

max-width:430px;

min-height:560px;

padding:35px;

background:#fffaf5;

border-radius:28px;

display:flex;

flex-direction:column;

justify-content:flex-start;

}

background:#fff8ef;

padding:30px;

border-radius:25px;

box-shadow:0 20px 40px rgba(0,0,0,.35);

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(35px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h1{

text-align:center;

color:#8b0000;

margin-bottom:15px;

}

.subtitle{

text-align:center;

color:#5b3a29;

line-height:1.8;

margin-bottom:25px;

}

.chat{

display:flex;

flex-direction:column;

gap:18px;

margin-top:15px;

min-height:340px;

}

}

.myMsg{

align-self:flex-start;

background:#ffe4e8;

padding:12px 16px;

border-radius:18px 18px 18px 5px;

max-width:85%;

}

.hisMsg{

align-self:flex-end;

background:#8b0000;

color:white;

padding:12px 16px;

border-radius:18px 18px 5px 18px;

max-width:85%;

}

input{

width:100%;

padding:14px;

border-radius:30px;

border:2px solid #e4c7c7;

outline:none;

font-size:16px;

margin-top:10px;

}

button{

margin-top:15px;

padding:14px 30px;

border:none;

border-radius:40px;

background:#8b0000;

color:white;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}

</style>

</head>
<body>

<div class="card">

<h1>Hieeeee Babyyyy ❤️</h1>

<p class="subtitle">

Before I let you enter...

<br><br>

Say hello to me first. 🥹❤️

</p>

<div class="chat">

<div class="myMsg">

Hieeeee Babyyyy ❤️

</div>

<div id="replyBox">

<input
id="reply"
type="text"
placeholder="Type Hii Baby ❤️"
>

<button id="sendBtn">

Send ❤️

</button>

</div>

<div id="messages"></div>

</div>

</div>

<script>

document.getElementById("sendBtn").onclick=function(){

let msg=document.getElementById("reply").value.trim();

if(msg==""){

alert("At least say Hiiiii ❤️");

return;

}

document.getElementById("replyBox").style.display="none";

const box=document.getElementById("messages");

box.innerHTML="";

setTimeout(()=>{

box.innerHTML+=`
<div class="hisMsg">${msg}</div>
`;

},700);

setTimeout(()=>{

box.innerHTML+=`
<div class="myMsg">
Happy Boyfriend's Dayyyyy ❤️🥹
</div>
`;

},2500);

setTimeout(()=>{

box.innerHTML+=`
<div class="myMsg">
I made something only for you... ❤️
</div>
`;

},4500);

setTimeout(()=>{

box.innerHTML+=`
<div class="myMsg">
Every page is filled with memories, love and little surprises. 🥹❤️
</div>
`;

},6500);

setTimeout(()=>{

box.innerHTML+=`
<div style="margin-top:25px;text-align:center;">
<button id="continueBtn">
Continue ❤️
</button>
</div>
`;

document.getElementById("continueBtn").onclick=function(){

// Page 2 code will go here later

};

},8500);

}
</script>
</body>

</html>
